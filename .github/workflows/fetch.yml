name: Fetch & Analyze (22:10 TPE)
on:
  schedule:
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "強制重跑（即使最近交易日已分析過，也重做外資分析與 AI 交叉確認）"
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas groq feedparser yfinance
      - name: Fetch & analyze (intersection mode)
        env:
          DAYS: "2"
          TOP_N: "10"
          ORDER_BY: "last_rank"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          FORCE_RUN: ${{ inputs.force_run && '1' || '' }}
        run: python fetch_analyze.py
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history/*.json exports/*.csv data/watchlist.json
          git commit -m "Update data $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes"
          git push
